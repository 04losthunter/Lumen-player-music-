- name: List files to debug
      run: dir
      name: Build Lumen Player EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: pip install pyinstaller ytmusicapi yt-dlp PyQt6 numpy scipy sounddevice soundfile
      
    - name: Compile to EXE
      run: pyinstaller --noconsole --onefile --name "LumenPlayer" player.py
      
    - name: Upload Final App
      uses: actions/upload-artifact@v4
      with:
        name: LumenPlayer-App
        path: dist/LumenPlayer.exe
